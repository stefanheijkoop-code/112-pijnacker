<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>112 Regio Pijnacker</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#07101d;--card:#101c2d;--muted:#91a0b5;--text:#f5f7fb;--line:#203049}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:env(safe-area-inset-top) 14px 88px}.top{position:sticky;top:0;z-index:999;background:rgba(7,16,29,.95);backdrop-filter:blur(14px);padding:14px 0 10px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#0d1828;color:#cbd5e1;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px}.chip.on{background:#e8f3ff;color:#09233f;border-color:#e8f3ff}.statsLabel{font-size:11px;color:var(--muted);margin:14px 2px 6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}#map{height:260px;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin:10px 0 14px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 8px}.sectionTitle h2{font-size:17px;margin:0}.sectionTitle span{font-size:12px;color:var(--muted)}.list{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.row{display:flex;gap:10px;align-items:flex-start}.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}.brandweer{background:#3a1717}.ambulance{background:#153326}.politie{background:#152b45}.trauma{background:#4a3812}.meta{font-size:12px;color:var(--muted);margin-bottom:4px}.title{font-size:14px;font-weight:650;line-height:1.35}.place{font-size:12px;color:#b8c5d6;margin-top:5px}.prio{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:6px;background:#26364c;color:#dce8f7;font-size:10px}.empty{padding:28px 15px;text-align:center;color:var(--muted)}a{color:#8cc6ff;text-decoration:none}.footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 8px}.refresh{border:0;background:#16253a;color:#dbeafe;border-radius:10px;padding:8px 11px;font-size:17px}.search{width:100%;margin-top:10px;background:#0d1828;border:1px solid var(--line);border-radius:12px;color:white;padding:11px 12px;font-size:14px}@media(min-width:760px){.wrap{padding-left:24px;padding-right:24px}.stats{grid-template-columns:repeat(4,140px)}#map{height:360px}.list{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div><h1>🚨 112 Regio Pijnacker</h1><div class="sub" id="updated">Meldingen laden…</div></div><button class="refresh" onclick="load(true)">↻</button></div><input id="q" class="search" placeholder="Zoek straat, plaats of melding…" oninput="render()"><div class="chips" id="services"></div><div class="chips" id="places"></div></div><div class="statsLabel">Meldingen laatste 24 uur</div><div class="stats" id="stats"></div><div id="map"></div><div class="sectionTitle"><h2>Laatste meldingen</h2><span id="count"></span></div><div class="list" id="list"></div><div class="footer">P2000-data via <a href="https://112-nu.nl" target="_blank">112-nu.nl</a> en Alarmeringen.nl. Persoonlijk dashboard; bel bij nood altijd 112.</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const DATA='https://raw.githubusercontent.com/stefanheijkoop-code/112-pijnacker/main/data.json';const icons={Brandweer:'🔥',Ambulance:'🚑',Politie:'🚓',Traumahelikopter:'🚁'};const cls={Brandweer:'brandweer',Ambulance:'ambulance',Politie:'politie',Traumahelikopter:'trauma'};const centers={'Pijnacker':[52.0195,4.4294],'Nootdorp':[52.0439,4.3958],'Delfgauw':[52.0066,4.3970],'Berkel en Rodenrijs':[51.9937,4.4788],'Oude Leede':[51.9968,4.4108],'Delft':[52.0116,4.3571]};let data=[],service='Alle',place='Alle',map,markers;function chips(){const ss=['Alle','Brandweer','Ambulance','Politie','Traumahelikopter'];services.innerHTML=ss.map(x=>`<button class="chip ${service===x?'on':''}" onclick="service='${x}';chips();render()">${x==='Alle'?'Alles':icons[x]+' '+x}</button>`).join('');const ps=['Alle',...Object.keys(centers)];places.innerHTML=ps.map(x=>`<button class="chip ${place===x?'on':''}" onclick="place='${x}';chips();render()">${x}</button>`).join('')}function initMap(){map=L.map('map',{zoomControl:false}).setView([52.018,4.41],11);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markers=L.layerGroup().addTo(map)}function filtered(){let z=data;if(service!=='Alle')z=z.filter(x=>x.service===service);if(place!=='Alle')z=z.filter(x=>x.place===place);const s=q.value.trim().toLowerCase();if(s)z=z.filter(x=>(x.title+' '+x.location+' '+x.place+' '+x.original).toLowerCase().includes(s));return z}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const z=filtered();count.textContent=z.length+' meldingen';list.innerHTML=z.length?z.map(x=>`<div class="item"><div class="row"><div class="ico ${cls[x.service]||'politie'}">${icons[x.service]||'⚠️'}</div><div><div class="meta">${x.time_label||''} · ${x.service}${x.priority?`<span class="prio">${x.priority}</span>`:''}</div><div class="title">${esc(x.title)}</div><div class="place">📍 ${esc(x.location||x.place)}</div></div></div></div>`).join(''):'<div class="empty">Geen meldingen binnen deze filters.</div>';const counts={Brandweer:0,Ambulance:0,Politie:0,Traumahelikopter:0};const cutoff=Date.now()-24*60*60*1000;data.forEach(x=>{const t=Date.parse(x.published);if(Number.isFinite(t)&&t>=cutoff&&t<=Date.now()+5*60*1000&&Object.prototype.hasOwnProperty.call(counts,x.service))counts[x.service]++});stats.innerHTML=Object.keys(counts).map(x=>`<div class="stat"><b>${counts[x]}</b><span>${icons[x]} ${x==='Traumahelikopter'?'Trauma':x}</span></div>`).join('');markers.clearLayers();z.slice(0,100).forEach(x=>{const c=x.lat&&x.lon?[x.lat,x.lon]:centers[x.place];if(c)L.marker(c).bindPopup(`<b>${icons[x.service]||''} ${esc(x.service)}</b><br>${esc(x.title)}<br><small>${esc(x.location||x.place)}</small>`).addTo(markers)})}async function load(bust=false){try{const r=await fetch(DATA+(bust?'?t='+Date.now():''),{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();data=j.incidents||[];updated.textContent='● Live · bijgewerkt '+(j.updated_label||'onbekend');render()}catch(e){updated.textContent='Kon live meldingen niet laden';list.innerHTML='<div class="empty">De databron is tijdelijk niet bereikbaar. Tik op ↻ om opnieuw te proberen.</div>'}}chips();initMap();load();setInterval(()=>load(true),60000);</script></body></html>
