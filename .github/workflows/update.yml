name: Update 112 meldingen
on:
  push:
    branches: [main, test-live-refresh]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: update-112-data-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disable slow geocoding in live path
        run: sed -i 's/MAX_NEW_GEOCODES=3/MAX_NEW_GEOCODES=0/' scripts/update.py
      - name: Fetch latest P2000 feeds
        run: python scripts/update.py
      - name: Normalize services and timestamps
        run: python scripts/fixup.py
      - name: Validate data
        run: |
          python - <<'PY'
          import json
          with open('data.json', encoding='utf-8') as f:
              d=json.load(f)
          inc=d.get('incidents',[])
          assert len(inc)>0, 'No incidents found'
          assert d.get('updated'), 'Missing updated timestamp'
          allowed={'Pijnacker','Nootdorp','Delfgauw','Berkel en Rodenrijs','Oude Leede','Delft'}
          assert all(x.get('place') in allowed for x in inc), 'Unexpected place in data'
          assert all(x.get('service') in {'Brandweer','Ambulance','Politie','Traumahelikopter'} for x in inc), 'Unexpected service in data'
          keys=[]
          for x in inc:
              loc=' '.join((x.get('location') or x.get('title','')).lower().split())
              keys.append((x.get('service'),x.get('place'),x.get('published','')[:16],loc))
          assert len(keys)==len(set(keys)), 'Duplicate normalized incident rows remain'
          print('validated incidents:', len(inc), 'updated:', d['updated'])
          PY
      - name: Save fresh data
        run: |
          git config user.name "112 Pijnacker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json geocode_cache.json
          git diff --cached --quiet || (git commit -m "Update 112 meldingen" && git push)
